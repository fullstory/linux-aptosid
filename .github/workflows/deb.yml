name: deb

on:
  push:
    tags: ['debian/*']
  workflow_dispatch:
    inputs:
      tag:
        description: debian/* tag to build
        required: true

permissions: {}

jobs:
  build:
    uses: fullstory/ci/.github/workflows/deb.yml@v1
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      # debian-only tree: fetch and dfsg-prune the orig, unpack it here
      prepare: |
        apt-get install -y --no-install-recommends wget xz-utils pixz bzip2 rsync unifdef patch quilt
        orig=$(debian/rules get-orig-source | awk '/^COMPLETED:/ { print $2 }')
        mv "$orig" ..
        tar -xJf ../"$(basename "$orig")" --strip 1

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: out
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "CI build for development. Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
